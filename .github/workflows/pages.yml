name: Publish documentation to GitHub Pages

# One build and one deploy: this is a Jekyll site with no theme gem (`theme: null` in
# _config.yml), so `jekyll-build-pages` needs nothing but the source tree. The layout in
# _layouts/default.html supplies the header, the sidebar, and the theme control; the sidebar's
# order and labels come from _data/nav.yml. Nothing here minifies or post-processes the CSS.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
